name: Deploy GEOAI Talent

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show GitHub identity
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository owner: ${{ github.repository_owner }}"
          echo "Ref: ${{ github.ref }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: prestij-mohye-delimanextgen
          workload_identity_provider: projects/4415568906/locations/global/workloadIdentityPools/github-actions-pool/providers/github
          service_account: github-actions@prestij-mohye-delimanextgen.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -t asia-southeast1-docker.pkg.dev/prestij-mohye-delimanextgen/geoai-talent/geoai-talent:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            asia-southeast1-docker.pkg.dev/prestij-mohye-delimanextgen/geoai-talent/geoai-talent:${{ github.sha }}

      - name: Deploy to deployment-server
        run: |
          gcloud compute ssh jothikannan2009@deployment-server \
            --zone=asia-southeast1-b \
            --tunnel-through-iap \
            --command="
              docker pull asia-southeast1-docker.pkg.dev/prestij-mohye-delimanextgen/geoai-talent/geoai-talent:${{ github.sha }};
              docker stop geoai_talent || true;
              docker rm geoai_talent || true;
              docker run -d \
                --name geoai_talent \
                -p 8004:3000 \
                --env-file /opt/geoai_talent/.env.docker \
                asia-southeast1-docker.pkg.dev/prestij-mohye-delimanextgen/geoai-talent/geoai-talent:${{ github.sha }}
            "

      - name: Verify deployment
        run: |
          gcloud compute ssh jothikannan2009@deployment-server \
            --zone=asia-southeast1-b \
            --tunnel-through-iap \
            --command="
              docker ps --filter name=geoai_talent;
              docker logs --tail 50 geoai_talent
            "
